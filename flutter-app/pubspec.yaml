name: health_rag
description: "Health RAG Chatbot — Sunrise Family Clinic. Decision-support for doctors and clinic staff; answers only from the clinic records (synthetic demo data)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Backend API calls.
  http: ^1.6.0
  # Persist JWT, API base URL, language, chat history.
  shared_preferences: ^2.5.6
  # Pick PDFs to upload.
  file_picker: ^13.4.0
  # Voice input (speech-to-text).
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
